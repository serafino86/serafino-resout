# Redirect del sito serafino-resout.ch (spec docs/specs/2026-11-09-sito-nuova-linea.md §2, T21).
# Incluso nel server{} di /docker/serafino-resout/nginx.conf con:  include /etc/nginx/conf.d/redirects.inc;
# (percorso nel container da adattare al mount). Prima dell'include TOGLIERE da nginx.conf i location
# gia' presenti per centralina/diagnostic/calculateur, altrimenti nginx -t da' "duplicate location".
# Nessun segreto qui: file pubblico.
# Nel server{} mettere anche "absolute_redirect off;" (test locale: senza, la Location usa la porta interna del container).
# Provato 09.11 in nginx:1.27-alpine locale: tutti i 301/410 corretti, nginx -t ok.

# Pagine servizi assorbite in /entreprises.html
location = /pme.html                        { return 301 /entreprises.html; }
location = /artisans.html                   { return 301 /entreprises.html; }
location = /horeca.html                     { return 301 /entreprises.html; }
location = /automatisation.html             { return 301 /entreprises.html; }
location = /app-sur-mesure.html             { return 301 /entreprises.html; }
location = /marketing-publicite-geneve.html { return 301 /entreprises.html; }
location = /geneve.html                     { return 301 /entreprises.html; }
location = /cas-planeto.html                { return 301 /entreprises.html; }

# Pagine rinominate
location = /formation-ia.html               { return 301 /apprendre-ia.html; }
location = /ia-locale-geneve.html           { return 301 /ia-chez-vous.html; }
location = /bot-personalise.html            { return 301 /ia-chez-vous.html; }

# Gia' redirette sul VPS (28.10): ora versionate qui
location = /centralina.html                 { return 301 /; }
location = /diagnostic.html                 { return 301 /; }
location = /calculateur.html                { return 301 /; }

# Guida: la futura guida vivra' in Apprendre l'IA
location = /guide                           { return 301 /apprendre-ia.html; }
location ^~ /guide/                         { return 301 /apprendre-ia.html; }

# Radar PME congelato: contenuto diverso, nessun redirect
location = /radar-pme                       { return 410; }
location ^~ /radar-pme/                     { return 410; }
